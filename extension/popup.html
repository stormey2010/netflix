<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Netflix Connect</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --card: #15151b;
      --card-2: #1c1c24;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f2f2f4;
      --muted: #8b8b95;
      --faint: #55555f;
      --red: #e50914;
      --green: #2dd573;
      --amber: #f5b342;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 360px;
      min-height: 440px;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: linear-gradient(180deg, rgba(229, 9, 20, 0.08), transparent);
      border-bottom: 1px solid var(--border);
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: #fff;
      background: linear-gradient(135deg, #e50914, #8f0610);
      flex-shrink: 0;
    }
    .header-info { flex: 1; min-width: 0; }
    .header-title { font-size: 14px; font-weight: 700; color: #fff; }
    .header-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .icon-btn {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none;
      color: var(--faint); cursor: pointer; border-radius: 8px;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .icon-btn svg { width: 16px; height: 16px; fill: currentColor; }

    /* Tabs */
    .tabs { display: flex; padding: 0 12px; border-bottom: 1px solid var(--border); }
    .tab-btn {
      flex: 1;
      background: transparent; border: none;
      color: var(--faint);
      padding: 12px 4px 11px;
      font: inherit; font-size: 11px; font-weight: 700;
      letter-spacing: 0.8px; text-transform: uppercase;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: var(--muted); }
    .tab-btn.active { color: #fff; border-bottom-color: var(--red); }

    .content { padding: 16px; }
    .tab-content { display: none; animation: fadeIn 0.18s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

    /* Session tab */
    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 16px;
      text-align: center;
      margin-bottom: 14px;
    }
    .hero-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--faint);
      margin: 0 auto 10px;
      transition: background 0.2s;
    }
    .hero.connected .hero-dot {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(45, 213, 115, 0.14);
      animation: pulse 2.4s ease-in-out infinite;
    }
    .hero.waiting .hero-dot, .hero.incoming .hero-dot {
      background: var(--amber);
      box-shadow: 0 0 0 4px rgba(245, 179, 66, 0.12);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.55; } }
    .hero-main { font-size: 14px; font-weight: 700; color: #fff; }
    .hero-sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 42px;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--card-2); color: var(--text);
      font: inherit; font-size: 13px; font-weight: 650;
      cursor: pointer;
      transition: background 0.15s, filter 0.15s, transform 0.1s;
    }
    .btn + .btn { margin-top: 10px; }
    .btn:hover:not(:disabled) { background: #24242e; }
    .btn:active:not(:disabled) { transform: scale(0.985); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.primary { background: var(--red); border-color: transparent; }
    .btn.primary:hover:not(:disabled) { filter: brightness(1.12); background: var(--red); }
    .btn.danger { color: #ff7a81; }
    .btn svg { width: 14px; height: 14px; fill: currentColor; }
    .btn-row { display: flex; gap: 10px; }
    .btn-row .btn + .btn { margin-top: 0; }

    .netflix-hint {
      margin-top: 14px;
      padding: 10px 12px;
      background: rgba(245, 179, 66, 0.08);
      border: 1px solid rgba(245, 179, 66, 0.25);
      border-radius: 10px;
      font-size: 11.5px;
      color: var(--amber);
      display: none;
    }
    .netflix-hint.visible { display: block; }

    /* Lists */
    .list-container { max-height: 280px; overflow-y: auto; margin: -4px; padding: 4px; }
    .list-container::-webkit-scrollbar { width: 4px; }
    .list-container::-webkit-scrollbar-thumb { background: #2a2a33; border-radius: 2px; }
    .list-item {
      display: flex; align-items: center; gap: 11px;
      padding: 8px; border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 3px;
    }
    .list-item:hover { background: rgba(255, 255, 255, 0.05); }
    .list-item-thumb {
      width: 58px; height: 33px; border-radius: 6px;
      object-fit: cover; background: var(--card-2); flex-shrink: 0;
    }
    .list-item-info { flex: 1; min-width: 0; }
    .list-item-title {
      font-size: 12.5px; font-weight: 600; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .list-item-meta { font-size: 10.5px; color: var(--faint); margin-top: 2px; }
    .list-item-remove {
      flex-shrink: 0;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none;
      color: var(--faint); cursor: pointer; border-radius: 7px;
      transition: background 0.15s, color 0.15s;
    }
    .list-item-remove:hover { color: var(--red); background: rgba(229, 9, 20, 0.12); }
    .list-item-remove svg { width: 13px; height: 13px; fill: currentColor; }

    .empty-state { text-align: center; padding: 44px 20px; }
    .empty-state-text { font-size: 12.5px; color: var(--muted); }
    .empty-state-sub { font-size: 11px; color: var(--faint); margin-top: 4px; }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
    }
    .stat-value { font-size: 22px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
    .stat-card.highlight { grid-column: span 2; }
    .stat-card.highlight .stat-value { color: var(--red); }
    .stat-label {
      font-size: 9.5px; font-weight: 700;
      color: var(--faint);
      text-transform: uppercase; letter-spacing: 1.2px;
      margin-top: 5px;
    }
    .stats-footer { text-align: center; font-size: 10.5px; color: var(--faint); margin-top: 12px; }

    /* Toast */
    .status-toast {
      position: fixed;
      bottom: 14px; left: 14px; right: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px; font-weight: 550;
      text-align: center;
      animation: slideUp 0.2s ease;
      z-index: 100;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .status-toast.error { background: #3a1216; color: #ff8a90; border: 1px solid rgba(229, 9, 20, 0.3); }
    .status-toast.ok { background: #0f2b18; color: #6fe39a; border: 1px solid rgba(45, 213, 115, 0.25); }
    .status-toast:empty { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="avatar" id="avatar">?</div>
    <div class="header-info">
      <div class="header-title" id="userName">Netflix Connect</div>
      <div class="header-sub" id="hintText">Watch together</div>
    </div>
    <button class="icon-btn" id="settingsBtn" title="Switch profile">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.61 3.61 0 0 1 8.4 12c0-1.98 1.62-3.6 3.6-3.6s3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="connect">Session</button>
    <button class="tab-btn" data-tab="watchlist">Watchlist</button>
    <button class="tab-btn" data-tab="stats">Stats</button>
  </div>

  <div class="content">
    <!-- Session tab -->
    <div class="tab-content active" id="tab-connect">
      <div class="hero" id="hero">
        <div class="hero-dot"></div>
        <div class="hero-main" id="connStatus">Checking&hellip;</div>
        <div class="hero-sub" id="stateDetail"></div>
      </div>

      <div id="actionArea">
        <button id="invite" class="btn primary">
          <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <span id="inviteLabel">Send Invite</span>
        </button>
        <div class="btn-row" id="incomingRow" style="display:none; margin-top:10px;">
          <button id="accept" class="btn primary">Accept</button>
          <button id="decline" class="btn">Decline</button>
        </div>
        <button id="disconnect" class="btn danger" style="display:none;">End Session</button>
      </div>

      <div class="netflix-hint" id="netflixHint">
        Open netflix.com in a tab for playback sync to work.
      </div>
    </div>

    <!-- Watchlist tab -->
    <div class="tab-content" id="tab-watchlist">
      <div class="list-container" id="watchlistContainer">
        <div class="empty-state">
          <div class="empty-state-text">Loading&hellip;</div>
        </div>
      </div>
    </div>

    <!-- Stats tab -->
    <div class="tab-content" id="tab-stats">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" id="statHours">0</div><div class="stat-label">Hours</div></div>
        <div class="stat-card"><div class="stat-value" id="statSessions">0</div><div class="stat-label">Sessions</div></div>
        <div class="stat-card"><div class="stat-value" id="statTitles">0</div><div class="stat-label">Titles</div></div>
        <div class="stat-card"><div class="stat-value" id="statEpisodes">0</div><div class="stat-label">Episodes</div></div>
        <div class="stat-card highlight"><div class="stat-value" id="statAllTime">0h</div><div class="stat-label">All-Time Together</div></div>
      </div>
      <div class="stats-footer">Last 30 days</div>
    </div>
  </div>

  <div class="status-toast" id="status"></div>

  <script src="js/config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
